[package]
name = "same_block_sniper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana (pinned to 2.1.x — 2.2 resolves to 3.0 which breaks API)
solana-sdk = "2.1"
solana-client = "2.1"
solana-program = "2.1"
solana-account-decoder = "2.1"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# gRPC (ShredStream)
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
toml = "0.8"
config = "0.14"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5.0"

# Token programs
spl-associated-token-account = "4.0.0"
spl-token = "6.0.0"
mpl-token-metadata = "5.1.1"

# QUIC clients (bloXroute submit-snipe, NextBlock)
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-native-certs = "0.7"

# Crypto
sha2 = "0.10"
flate2 = "1.0"

# API-key vault encryption (panel keys at rest) + hex encoding for vault files
aes-gcm = "0.10"
hex = "0.4"

# Vault v2 KDF — shared with the TS bot (scrypt N=16384, r=8, p=1, 32-byte key)
scrypt = { version = "0.11", default-features = false }

# OpenSSL (required by solana-sdk, vendored to avoid system dependency)
openssl = { version = "0.10", features = ["vendored"] }

# Trading SDK (pending: blocked by solana-sdk v2→v3 conflict, see CLAUDE.md)
# sol-trade-sdk = { path = "../sol-trade-sdk", version = "3.6.2" }

# ShredStream SDK — will integrate after SDK upgrade, keeping yellowstone for gRPC
# yellowstone-grpc-client = "13.1" requires solana 3.x (blocked)
# solana-stream-sdk = "1.2" requires solana 3.x (blocked)
# These will be added in Phase 2 after full 3.x migration

# Concurrent data structures for adaptive routing
dashmap = "6"

# Utilities
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.18"
scopeguard = "1.2"
lru = "0.12"
rand = "0.8"
arc-swap = "1"
notify = { version = "8", features = ["macos_fsevent"] }
prost-types = "0.13"
